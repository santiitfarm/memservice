name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_ENV: "test"
  AUTH_SECRET: "ci_pipeline_auth_secret_key_testing_12345"
  SETTINGS_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  MONGODB_CONNECTION_STRING: "mongodb://127.0.0.1:27017/memservice_test?replicaSet=rs0&directConnection=true"
  MONGO_URI: "mongodb://127.0.0.1:27017/memservice_test?replicaSet=rs0&directConnection=true"
  NEXT_PUBLIC_API_URL: "http://localhost:3001"
  API_URL: "http://localhost:3001"
  NEXT_PUBLIC_APP_URL_DEV: "http://localhost:3001"
  NEXT_PUBLIC_APP_URL_PRODUCTION: "http://localhost:3001"
  NEXT_PUBLIC_URL: "http://localhost:3000"
  NEXT_PUBLIC_ADMIN_URL: "http://localhost:3002"

jobs:
  test-and-verify:
    name: Build, Lint, Test & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"try { rs.status().myState === 1 ? quit(0) : quit(1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}); quit(1) }\""
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 10s
          --entrypoint mongod
        command: --replSet rs0 --bind_ip_all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed test database
        run: node scripts/seed.mjs

      - name: Run code linter
        run: pnpm lint

      - name: Run API test suite
        run: pnpm test:api

      - name: Build applications
        run: pnpm build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Run dependency security audit
        run: pnpm audit --audit-level=high

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
