name: memservice

services:
  mongo:
    image: mongo:7
    container_name: memservice-mongo
    restart: unless-stopped
    # Single-node replica set: required by the order API (mongoose transactions)
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once PRIMARY
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().myState === 1 ? quit(0) : quit(1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Optional DB UI:  docker compose --profile tools up -d mongo-express
  mongo-express:
    image: mongo-express:1
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo_data:
